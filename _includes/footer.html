<footer class="site-foot">
  <div class="wrap">
    <p>© {{ site.time | date: '%Y' }} {{ site.author }}</p>
    <ul>
      <li><a href="mailto:{{ site.contact.email }}">Email</a></li>
      {% for p in site.contact.profiles %}<li><a href="{{ p[1] }}">{{ p[0] }}</a></li>
      {% endfor %}{% if site.posts.size > 0 %}<li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>{% endif %}
    </ul>
  </div>
</footer>
