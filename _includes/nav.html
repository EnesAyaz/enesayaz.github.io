<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      {% for link in site.navbar-links %}{% if link[0] != "Blog" or site.posts.size > 0 %}<a href="{{ link[1] | relative_url }}"{% if page.nav == link[0] %} aria-current="page"{% endif %}>{{ link[0] }}</a>
      {% endif %}{% endfor %}
    </nav>
  </div>
</header>
