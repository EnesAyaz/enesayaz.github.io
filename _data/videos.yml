# Videos on the Animations page, rendered with Manim. Files are in assets/video.
- id: rotating-field
  title: Rotating stator field
  text: Three balanced phase currents add up to a field of constant size that rotates. The teal arrows show the fundamental of the radial air-gap field.
- id: rotor-dq
  title: Rotor coordinates and torque
  text: In the rotor frame the d and q currents are constant. The q current produces the torque when the d and q inductances are equal.
- id: load-step
  title: Load step of a synchronous machine
  text: When the load increases, the rotor slows down for a moment and settles at a larger power angle. Reduced classical model with normalized time.
