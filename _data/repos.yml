# Public GitHub repositories shown on the Research Projects page.
- group: Teaching and tools
  items:
    - {name: PWM Explorer, url: "https://enesayaz.github.io/Modulation-Course/", repo: Modulation-Course, year: 2026, text: "Interactive visualisation of modulation methods for the KTH course EJ2311, from two-level and NPC converters to cascaded H-bridge, flying capacitor and MMC."}
- group: Wireless power transfer and GaN
  items:
    - {name: Narrowband and wideband WPT, repo: Narrowband-Wideband, year: 2024, text: "Circuit models, analysis and experiments for the dual-mode wireless power transfer system with a single transmitter."}
    - {name: WPT-Motor, repo: WPTMotor, year: 2021–2023, text: "Studies on combining motor drives with wireless power transfer, including contactless slip rings and field excitation."}
    - {name: Studies, repo: Studies, year: 2020–2023, text: "Working notes and models on GaN devices, wireless power transfer, Roebel windings, wind turbine generators and common-mode behaviour."}
