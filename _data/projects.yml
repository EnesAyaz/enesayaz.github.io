# papers: link text and DOI.
- title: 1.2 kV traction inverters for heavy-duty electric vehicles
  place: KTH
  text: >-
    Raising the dc-link from 800 V to 1.2 kV so that trucks can use megawatt charging.
    System-level assessment of battery, inverter and motor, with the inverter validated on a
    250 kW SiC prototype at about 99.1% efficiency.
  papers:
    - {label: IEEE Access 2026, doi: 10.1109/ACCESS.2026.3697246}
    - {label: ECCE Europe 2025, doi: 10.1109/ecce-europe62795.2025.11238433}
    - {label: SPEC 2024, doi: 10.1109/spec62217.2024.10893180}
- title: Carrier phase-shift modulation
  place: KTH
  text: >-
    Adapting the carriers of two-level inverters in real time to reduce common-mode voltage
    and dc-link capacitor stress, with no extra hardware.
  papers:
    - {label: IPEC-Nagasaki 2026, doi: 10.23919/ipec-nagasaki2026-ec64663.2026.11596703}
    - {label: ECCE Europe 2025, doi: 10.1109/ecce-europe62795.2025.11238855}
- title: SiC device characterisation and health monitoring
  place: KTH
  text: >-
    Double-pulse testing, condition monitoring and reliability of SiC MOSFETs and power modules,
    including compensated on-state resistance as an indicator of package degradation.
  papers:
    - {label: IEEE Trans. Power Electronics 2027 (early access), doi: 10.1109/TPEL.2026.3723729}
    - {label: EuroSimE 2025, doi: 10.1109/eurosime65125.2025.11006626}
    - {label: ECCE Europe 2024, doi: 10.1109/ecceeurope62508.2024.10751827}
- title: Contactless field excitation
  place: KTH and METU
  text: >-
    Feeding the rotor winding of electrically excited synchronous machines by wireless power
    transfer, using the existing motor-drive inverter or a bipolar supply for pole-changing machines.
  papers:
    - {label: IEEE Trans. Industrial Electronics 2026, doi: 10.1109/TIE.2026.3658721}
    - {label: IEEE Trans. Power Electronics 2023, doi: 10.1109/tpel.2023.3300531}
- title: Concurrent wired and wireless power transfer
  place: METU PowerLab
  text: >-
    One converter that drives a motor at the fundamental frequency and powers a wireless link
    with its switching harmonics, each controlled independently.
  papers:
    - {label: IEEE Trans. Industrial Electronics 2023, doi: 10.1109/TIE.2022.3213908}
    - {label: IEEE JESTIE 2023, doi: 10.1109/JESTIE.2022.3182592}
- title: Modular, fault-tolerant inductive power transfer
  place: METU PowerLab
  text: >-
    Multi-transmitter, multi-receiver systems that balance power between modules and keep running
    after open-circuit faults, demonstrated on a 1 kW prototype with a resonator coil.
  papers:
    - {label: IEEE JESTPE 2023, doi: 10.1109/JESTPE.2022.3208423}
    - {label: IEEE JESTPE 2022, doi: 10.1109/JESTPE.2021.3074888}
