# Site configuration for the Chirpy theme (https://github.com/cotes2020/jekyll-theme-chirpy)

theme: jekyll-theme-chirpy
lang: en
timezone: Europe/Stockholm

title: Enes Ayaz
tagline: Power electronics researcher at KTH
description: >-
  Ph.D. candidate in power electronics at KTH Royal Institute of Technology, working on holistic optimization
  of electric traction drives, modulation and wireless power transfer.

url: "https://enesayaz.github.io"
baseurl: ""

github:
  username: EnesAyaz

social:
  name: Enes Ayaz
  email: enesa@kth.se
  links:
    - https://www.kth.se/profile/enesa
    - https://github.com/EnesAyaz
    - https://scholar.google.com/citations?user=q9CcLWAAAAAJ
    - https://orcid.org/0000-0002-5677-1336

# Photo in the sidebar
avatar: /assets/img/avatar.jpg

# light | dark. Empty follows the visitor's system and shows a switch in the sidebar.
theme_mode:

toc: true

pwa:
  enabled: false

# ------------ Theme internals ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  animations:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: animations
    values:
      layout: page
      permalink: /animations/:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - vendor
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
