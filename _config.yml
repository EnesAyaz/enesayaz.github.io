###########################################################
### Settings for enesayaz.github.io
### Publications: _data/publications.yml   Research cards: _data/projects.yml
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Enes Ayaz

# Your name to show in the footer
author: Enes Ayaz

# Site address, used for canonical links and social previews
url: https://enesayaz.github.io

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Home: "/"
  Publications: "/publications"
  CV: "/CV"

# Portrait on the home page, also used for link previews. Uncomment to show it.
#avatar: "/assets/img/profile.png"

# Contact details, shown on the home page and in the footer
contact:
  email: enesa@kth.se
  profiles:
    Google Scholar: "https://scholar.google.com/citations?user=q9CcLWAAAAAJ"
    ORCID: "https://orcid.org/0000-0002-5677-1336"
    GitHub: "https://github.com/EnesAyaz"
    KTH profile: "https://www.kth.se/profile/enesa"

# Word length of automatic page descriptions
excerpt_length: 50

#################################
# --- Web Analytics Section --- #
#################################

# Fill in your Google Analytics gtag.js ID to track your website using gtag
#gtag: ""

# Fill in your Google Analytics ID to track your website using Google Analytics
#google_analytics: ""

# Fill in your Cloudflare Analytics beacon token to track your website using Cloudflare Analytics
#cloudflare_analytics: ""

# Google Tag Manager ID
#gtm: ""

# Matomo (aka Piwik) Web statistics
# Uncomment the following section to enable Matomo. The opt-out parameter controls
# whether or not you want to allow users to opt out of tracking.
#matomo:
#  site_id: "9"
#  uri: "demo.wiki.pro"
#  opt-out: true

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%B %-d, %Y"

# Facebook App ID
#fb_app_id: ""

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "Europe/Stockholm"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - staticman.yml
  - beautiful-jekyll-theme.gemspec

plugins:
  - jekyll-sitemap

