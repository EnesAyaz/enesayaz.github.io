# Temporary: publishes the built site of this branch to the preview-build branch for review.
name: Preview
on:
  push:
    branches: [chirpy]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - run: |
          set -o pipefail
          bundle exec jekyll b -d /tmp/out/site 2>&1 | tee /tmp/build.log || echo "BUILD FAILED" >> /tmp/build.log
          mkdir -p /tmp/out/site
          cp _drafts/post-template.md _posts/2026-01-01-sample-post.md
          bundle exec jekyll b -d /tmp/out/sample 2>&1 | tee -a /tmp/build.log || echo "SAMPLE BUILD FAILED" >> /tmp/build.log
          bundle exec htmlproofer /tmp/out/site --disable-external >> /tmp/build.log 2>&1 || echo "PROOFER FAILED" >> /tmp/build.log
          cp /tmp/build.log /tmp/out/build.log
        env:
          JEKYLL_ENV: production
      - run: |
          cd /tmp/out && git init -q -b preview-build && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Preview build"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-build
