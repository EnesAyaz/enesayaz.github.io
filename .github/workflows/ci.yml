name: Build site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same builder GitHub Pages uses to publish the site
      - uses: actions/jekyll-build-pages@v1
      - name: Check that the main pages were built
        run: |
          ls -R _site | head -40
          test -s _site/index.html
          test -s _site/CV/index.html
          test -s _site/publications/index.html
