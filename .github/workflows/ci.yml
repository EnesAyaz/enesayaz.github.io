name: Build site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same builder GitHub Pages uses to publish the site
      - uses: actions/jekyll-build-pages@v1
      - name: Check that the main pages were built
        run: |
          for p in index.html research/index.html publications/index.html blog/index.html CV/index.html feed.xml; do
            test -s "_site/$p" || { echo "missing $p"; exit 1; }
          done
          test "$(grep -c 'class="pub"' _site/publications/index.html)" -ge 24
          if grep -rlE '\{\{|\{%' _site --include=*.html; then echo "unrendered Liquid"; exit 1; fi
      # Build once more with the post template as a real post, so blog layout problems are caught
      - name: Add a sample post
        run: |
          mkdir -p _posts
          cp _drafts/post-template.md _posts/2026-01-01-sample-post.md
      - uses: actions/jekyll-build-pages@v1
        with:
          destination: ./_sample
      - name: Check that the sample post was built
        run: |
          f=_sample/blog/2026/sample-post/index.html
          test -s "$f" || { echo "post not built"; exit 1; }
          for s in 'Your post title' 'min read' 'mathjax' 'Cite this post' 'class="highlight"' '<table>'; do
            grep -q "$s" "$f" || { echo "missing: $s"; exit 1; }
          done
          grep -q 'sample-post' _sample/blog/index.html
          grep -q 'Latest posts' _sample/index.html
          grep -q '>Blog</a>' _sample/index.html
          grep -q 'sample-post' _sample/feed.xml
          if grep -rlE '\{\{|\{%' _sample --include=*.html; then echo "unrendered Liquid"; exit 1; fi
